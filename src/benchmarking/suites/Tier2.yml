benchmarking.diags.AnnualCycle: &2d_variables
  clivi:
    var_name: clivi
    frequency: mon
    reference_data: benchmarking.data.ESACCICloud
    other_data: [benchmarking.data.CMIP6HistoricalR1I1P1F1]
  clt:
    var_name: clt
    frequency: mon
    reference_data: benchmarking.data.ESACCICloud
    other_data: [benchmarking.data.ERA5]
  clwvi:
    var_name: clt
    frequency: mon
    reference_data: benchmarking.data.ESACCICloud
  hfls:
    var_name: hfls
    frequency: mon
    reference_data: benchmarking.data.MERRA2
  hfss:
    var_name: hfls
    frequency: mon
    reference_data: benchmarking.data.MERRA2
  hus400:
    var_name: hus
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 400.0
    reference_data: benchmarking.data.ERA5
  lwcre:
    var_name: lwcre
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
    other_data: [benchmarking.data.ESACCICloud]
