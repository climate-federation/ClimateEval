benchmarking.diags.Map: &general_variables
  lwcre:
    var_name: lwcre
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  pr:
    var_name: pr
    frequency: mon
    units: mm day-1
    reference_data: benchmarking.data.GPCP
    other_data: [benchmarking.data.ERA5]
  rlut:
    var_name: rlut
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  rsut:
    var_name: rsut
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  tas:
    var_name: tas
    frequency: mon
    reference_data: benchmarking.data.HadCRUT5
    other_data: [benchmarking.data.ERA5]
  ta200:
    var_name: ta
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 200.0
    reference_data: benchmarking.data.ERA5
  ta800:
    var_name: ta
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 800.0
    reference_data: benchmarking.data.ERA5

benchmarking.diags.TimeSeries: *general_variables
