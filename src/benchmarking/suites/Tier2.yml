benchmarking.diags.AnnualCycle: &2d_variables
  hfls:
    var_name: hfls
    frequency: mon
    reference_data: benchmarking.data.MERRA2
  hfss:
    var_name: hfls
    frequency: mon
    reference_data: benchmarking.data.MERRA2
  hus400:
    var_name: hus
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 400.0
    reference_data: benchmarking.data.ERA5
  lwcre:
    var_name: lwcre
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  pr:
    var_name: pr
    frequency: mon
    units: mm day-1
    reference_data: benchmarking.data.GPCP
    other_data: [benchmarking.data.ERA5]
  rlut:
    var_name: rlut
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  rsut:
    var_name: rsut
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  rtnt:
    var_name: rtnt
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  ta200:
    var_name: ta
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 200.0
    reference_data: benchmarking.data.ERA5
  ta800:
    var_name: ta
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 800.0
    reference_data: benchmarking.data.ERA5
  tas:
    var_name: tas
    frequency: mon
    reference_data: benchmarking.data.HadCRUT5
    other_data: [benchmarking.data.ERA5]
  ua200:
    var_name: ua
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 200.0
    reference_data: benchmarking.data.ERA5
  ua800:
    var_name: ua
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 800.0
    reference_data: benchmarking.data.ERA5

benchmarking.diags.Map: *2d_variables

benchmarking.diags.TimeSeries: *2d_variables

benchmarking.diags.ZonalLine: *2d_variables

benchmarking.diags.ZonalProfileAirPressure:
  hus:
    var_name: hus
    frequency: mon
    reference_data: benchmarking.data.ERA5
  ta:
    var_name: ta
    frequency: mon
    reference_data: benchmarking.data.ERA5
  ua:
    var_name: ua
    frequency: mon
    reference_data: benchmarking.data.ERA5
