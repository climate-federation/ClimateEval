    reference_data: benchmarking.data.ERA5
  tas:
    var_name: tas
    frequency: mon
    reference_data: benchmarking.data.HadCRUT5
    other_data: [benchmarking.data.ERA5]
  ua200:
    var_name: ua
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 200.0
    reference_data: benchmarking.data.ERA5
  ua800:
    var_name: ua
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 800.0
    reference_data: benchmarking.data.ERA5

