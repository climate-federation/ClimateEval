    reference_data: benchmarking.data.CERESEBAF
    other_data: [benchmarking.data.ESACCICloud]
  rtnt:
    var_name: rtnt
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
  swcre:
    var_name: swcre
    frequency: mon
    reference_data: benchmarking.data.CERESEBAF
    other_data: [benchmarking.data.ESACCICloud]
  ta200:
    var_name: ta
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 200.0
    reference_data: benchmarking.data.ERA5
  ta800:
    var_name: ta
    frequency: mon
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
