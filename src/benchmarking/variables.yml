# Atmosphere
# Source: https://github.com/WCRP-CMIP/cmip7-cmor-tables/blob/main/tables/CMIP7_atmos.json
pr:
  coordinates: [time, lat, lon]
  realm: atmosphere
  standard_name: precipitation_flux
  units: kg m-2 s-1
tas:
  coordinates: [time, lat, lon]
  realm: atmosphere
  standard_name: air_temperature
  units: K
