# Atmosphere
# Source: https://github.com/WCRP-CMIP/cmip7-cmor-tables/blob/main/tables/CMIP7_atmos.json
cl:
  coordinates: [time, alevel, lat, lon]
  long_name: Percentage Cloud Cover
  realm: atmos
  standard_name: cloud_area_fraction_in_atmosphere_layer
  units: "%"
cli:
  coordinates: [time, alevel, lat, lon]
  long_name: Mass Fraction of Cloud Ice
  realm: atmos
  standard_name: mass_fraction_of_cloud_ice_in_air
  units: kg kg-1
clivi:
  coordinates: [time, lat, lon]
  long_name: Ice Water Path
  realm: atmos
  standard_name: atmosphere_mass_content_of_cloud_ice
  units: kg m-2
clt:
  coordinates: [time, lat, lon]
  long_name: Total Cloud Cover Percentage
  realm: atmos
  standard_name: cloud_area_fraction
  units: "%"
clw:
  coordinates: [time, alevel, lat, lon]
  long_name: Mass Fraction of Cloud Liquid Water
  realm: atmos
  standard_name: mass_fraction_of_cloud_liquid_water_in_air
  units: kg kg-1
clwvi:
  coordinates: [time, lat, lon]
  long_name: Condensed Water Path
  realm: atmos
  standard_name: atmosphere_mass_content_of_cloud_condensed_water
  units: kg m-2
evspsbl:
  coordinates: [time, lat, lon]
  long_name: Evaporation Including Sublimation and Transpiration
  realm: atmos
  standard_name: water_evapotranspiration_flux
  units: kg m-2 s-1
hfls:
  coordinates: [time, lat, lon]
  long_name: Surface Upward Latent Heat Flux
  realm: atmos
  standard_name: surface_upward_latent_heat_flux
  units: W m-2
hfss:
  coordinates: [time, lat, lon]
  long_name: Surface Upward Sensible Heat Flux
  realm: atmos
  standard_name: surface_upward_sensible_heat_flux
  units: W m-2
hus:
  coordinates: [time, alevel, lat, lon]
  long_name: Specific Humidity
  realm: atmos
  standard_name: specific_humidity
  units: "1"
pfull:
  coordinates: [time, alevel, lat, lon]
  long_name: Pressure at Model Full-Levels
  realm: atmos
  standard_name: air_pressure
  units: Pa
phalf:
  coordinates: [time, alevel, lat, lon]
  long_name: Pressure on Model Half-Levels
  realm: atmos
  standard_name: air_pressure
  units: Pa
pr:
  coordinates: [time, lat, lon]
  long_name: Precipitation
  realm: atmos
  standard_name: precipitation_flux
  units: kg m-2 s-1
prw:
  coordinates: [time, lat, lon]
  long_name: Water Vapor Path
  realm: atmos
  standard_name: atmosphere_mass_content_of_water_vapor
  units: kg m-2
ps:
  coordinates: [time, lat, lon]
  long_name: Surface Air Pressure
  realm: atmos
  standard_name: surface_air_pressure
  units: Pa
psl:
  coordinates: [time, lat, lon]
  long_name: Sea Level Pressure
  realm: atmos
  standard_name: air_pressure_at_mean_sea_level
  units: Pa
rlut:
  coordinates: [time, lat, lon]
  long_name: TOA Outgoing Longwave Radiation
  realm: atmos
  standard_name: toa_outgoing_longwave_flux
  units: W m-2
rlutcs:
  coordinates: [time, lat, lon]
  long_name: TOA Outgoing Clear-Sky Longwave Radiation
  realm: atmos
  standard_name: toa_outgoing_longwave_flux_assuming_clear_sky
  units: W m-2
rsdt:
  coordinates: [time, lat, lon]
  long_name: TOA Incident Shortwave Radiation
  realm: atmos
  standard_name: toa_incoming_shortwave_flux
  units: W m-2
rsut:
  coordinates: [time, lat, lon]
  long_name: TOA Outgoing Shortwave Radiation
  realm: atmos
  standard_name: toa_outgoing_shortwave_flux
  units: W m-2
rsutcs:
  coordinates: [time, lat, lon]
  long_name: TOA Outgoing Clear-Sky Shortwave Radiation
  realm: atmos
  standard_name: toa_outgoing_shortwave_flux_assuming_clear_sky
  units: W m-2
rtmt:
  coordinates: [time, lat, lon]
  long_name: Net Downward Radiative Flux at Top of Model
  realm: atmos
  standard_name: net_downward_radiative_flux_at_top_of_atmosphere_model
  units: W m-2
ta:
  coordinates: [time, alevel, lat, lon]
  long_name: Air Temperature
  realm: atmos
  standard_name: air_temperature
  units: K
tas:
  coordinates: [time, lat, lon]
  long_name: Near-Surface Air Temperature
  realm: atmos
  standard_name: air_temperature
  units: K
tauu:
  coordinates: [time, lat, lon]
  long_name: Surface Downward Eastward Wind Stress
  realm: atmos
  standard_name: surface_downward_eastward_stress
  units: Pa
tauv:
  coordinates: [time, lat, lon]
  long_name: Surface Downward Northward Wind Stress
  realm: atmos
  standard_name: surface_downward_northward_stress
  units: Pa
ts:
  coordinates: [time, lat, lon]
  long_name: Surface Temperature
  realm: atmos
  standard_name: surface_temperature
  units: K
ua:
  coordinates: [time, alevel, lat, lon]
  long_name: Eastward Wind
  realm: atmos
  standard_name: eastward_wind
  units: m s-1
va:
  coordinates: [time, alevel, lat, lon]
  long_name: Northward Wind
  realm: atmos
  standard_name: northward_wind
  units: m s-1
wap:
  coordinates: [time, alevel, lat, lon]
  long_name: Omega (=dp/dt)
  realm: atmos
  standard_name: lagrangian_tendency_of_air_pressure
  units: Pa s-1
zg:
  coordinates: [time, alevel, lat, lon]
  long_name: Geopotential Height
  realm: atmos
  standard_name: geopotential_height
  units: m

# Land
# Source: https://github.com/WCRP-CMIP/cmip7-cmor-tables/blob/main/tables/CMIP7_land.json
gpp:
  coordinates: [time, lat, lon]
  long_name: Carbon Mass Flux out of Atmosphere Due to Gross Primary Production on Land [kgC m-2 s-1]
  realm: land
  standard_name: gross_primary_productivity_of_biomass_expressed_as_carbon
  units: kg m-2 s-1

# Ocean
# Source: https://github.com/WCRP-CMIP/cmip7-cmor-tables/blob/main/tables/CMIP7_ocean.json
so:
  coordinates: [time, olevel, lat, lon]
  long_name: Sea Water Salinity
  realm: ocean
  standard_name: sea_water_salinity
  units: "1E-03"
phcint:
  coordinates: [time, olevel, lat, lon]
  long_name: Integrated Ocean Heat Content from Potential Temperature
  realm: ocean
  standard_name: integral_wrt_depth_of_sea_water_potential_temperature_expressed_as_heat_content
  units: J m-2
thetao:
  coordinates: [time, olevel, lat, lon]
  long_name: Sea Water Potential Temperature
  realm: ocean
  standard_name: sea_water_potential_temperature
  units: degC
tos:
  coordinates: [time, lat, lon]
  long_name: Sea Surface Temperature
  realm: ocean
  standard_name: sea_surface_temperature
  units: degC

# Ocean biogeochemistry
# Source: https://github.com/WCRP-CMIP/cmip7-cmor-tables/blob/main/tables/CMIP7_ocnBgchem.json
chl:
  coordinates: [time, olevel, lat, lon]
  long_name: Mass Concentration of Total Phytoplankton Expressed as Chlorophyll in Sea Water
  realm: ocnBgchem
  standard_name: mass_concentration_of_phytoplankton_expressed_as_chlorophyll_in_sea_water
  units: kg m-3

# Sea Ice
# Source: https://github.com/WCRP-CMIP/cmip7-cmor-tables/blob/main/tables/CMIP7_sea_ice.json
siconc:
  coordinates: [time, lat, lon]
  long_name: Sea-Ice Area Percentage (Ocean Grid)
  realm: sea_ice
  standard_name: sea_ice_area_fraction
  units: "%"

