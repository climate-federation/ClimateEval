# Sea-ice evaluation suite (ported from ICONEval recipe_sea_ice_*).
#
# Evaluates sea-ice area concentration (siconc) per hemisphere:
#   * annual cycle of total hemispheric sea-ice area (1e6 km2)
#   * annual time series of the seasonal sea-ice minimum (NH September,
#     SH February)
#   * climatological maps of sea-ice concentration (full, February, September)
#
# Hemispheres are selected with min_lat/max_lat. Single-month evaluation uses
# an `extract_month` additional preprocessor. References are CMORized via
# ESMValTool: OSI-450 (per hemisphere), HadISST and NSIDC-G02202 (SH only).

- name: annual_cycle
  diagnostic: climateeval.diags.simple.SeaIceAreaAnnualCycle
  variables:
    - id: siconc_nh
      var_name: siconc
      frequency: mon
      min_lat: 30.0
      max_lat: 90.0
      reference_data: climateeval.data.OSI450NH
      other_data: [climateeval.data.HadISST]
    - id: siconc_sh
      var_name: siconc
      frequency: mon
      min_lat: -90.0
      max_lat: -30.0
      reference_data: climateeval.data.OSI450SH
      other_data: [climateeval.data.HadISST, climateeval.data.NSIDCG02202SH]

- name: annual_mean_timeseries
  diagnostic: climateeval.diags.simple.SeaIceAreaTimeSeries
  variables:
    # Northern Hemisphere September sea-ice minimum.
    - id: siconc_nh_sep
      var_name: siconc
      frequency: mon
      min_lat: 30.0
      max_lat: 90.0
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 9
      reference_data: climateeval.data.OSI450NH
      other_data: [climateeval.data.HadISST]
    # Southern Hemisphere February sea-ice minimum.
    - id: siconc_sh_feb
      var_name: siconc
      frequency: mon
      min_lat: -90.0
      max_lat: -30.0
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 2
      reference_data: climateeval.data.OSI450SH
      other_data: [climateeval.data.HadISST, climateeval.data.NSIDCG02202SH]

- name: map
  diagnostic: climateeval.diags.simple.Map
  variables:
    # Northern Hemisphere maps: full climatology, February, September.
    - &siconc_nh_map
      id: siconc_nh_map
      var_name: siconc
      frequency: mon
      min_lat: 40.0
      max_lat: 90.0
      reference_data: climateeval.data.OSI450NH
    - <<: *siconc_nh_map
      id: siconc_nh_map_feb
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 2
    - <<: *siconc_nh_map
      id: siconc_nh_map_sep
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 9
    # Southern Hemisphere maps: full climatology, February, September.
    - &siconc_sh_map
      id: siconc_sh_map
      var_name: siconc
      frequency: mon
      min_lat: -90.0
      max_lat: -40.0
      reference_data: climateeval.data.OSI450SH
    - <<: *siconc_sh_map
      id: siconc_sh_map_feb
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 2
    - <<: *siconc_sh_map
      id: siconc_sh_map_sep
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 9
