climateeval.diags.simple.DiurnalCycle:
  pr:
    var_name: pr
    frequency: 1hr
    reference_data: climateeval.data.ERA5Hourly
climateeval.diags.simple.Histogram:
  pr_global:
    var_name: pr
    frequency: 1hr
    units: mm day-1
    diagnostic_kwargs:
      bin_range: [0.0, 15.0]
    reference_data: climateeval.data.ERA5Hourly
  pr_tropics:
    var_name: pr
    frequency: 1hr
    min_lon: 0.0
    max_lon: 360.0
    min_lat: -30.0
    max_lat: 30.0
    units: mm day-1
    diagnostic_kwargs:
      bin_range: [0.0, 15.0]
    reference_data: climateeval.data.ERA5Hourly
