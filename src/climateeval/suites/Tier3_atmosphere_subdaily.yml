# Tier 3 | Variability & processes: sub-daily precipitation (diurnal cycle, intensity histograms).
- name: diurnal_cycle
  diagnostic: climateeval.diags.simple.DiurnalCycle
  variables:
    - id: pr
      var_name: pr
      frequency: 1hr
      units: mm day-1
      reference_data: climateeval.data.ERA5Hourly

- name: histogram
  diagnostic: climateeval.diags.simple.Histogram
  variables:
    - id: pr_global
      var_name: pr
      frequency: 1hr
      units: mm day-1
      diagnostic_kwargs:
        bin_range: [0.0, 15.0]
      reference_data: climateeval.data.ERA5Hourly
    - id: pr_tropics
      var_name: pr
      frequency: 1hr
      units: mm day-1
      min_lon: 0.0
      max_lon: 360.0
      min_lat: -30.0
      max_lat: 30.0
      diagnostic_kwargs:
        bin_range: [0.0, 15.0]
      reference_data: climateeval.data.ERA5Hourly
