# Tier 2 | Mean state vs observations: atmospheric climatology vs ERA5/GPCP/CERES-EBAF + CMIP6.
- name: annual_cycle
  diagnostic: climateeval.diags.simple.AnnualCycle
  variables: &2d_variables
    - id: clivi
      var_name: clivi
      frequency: mon
      reference_data: climateeval.data.ESACCICloud
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: clt
      var_name: clt
      frequency: mon
      reference_data: climateeval.data.ESACCICloud
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: clwvi
      var_name: clwvi
      frequency: mon
      reference_data: climateeval.data.ESACCICloud
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: hfls
      var_name: hfls
      frequency: mon
      reference_data: climateeval.data.MERRA2
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: hfss
      var_name: hfss
      frequency: mon
      reference_data: climateeval.data.MERRA2
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: hus400
      var_name: hus
      frequency: mon
      vertical_level:
        coordinate_name: air_pressure
        units: hPa
        value: 400.0
      reference_data: climateeval.data.ERA5Monthly
    - id: lwcre
      var_name: lwcre
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
       #other_data: [climateeval.data.ESACCICloud]
    - id: lwp
      var_name: lwp
      frequency: mon
      reference_data: climateeval.data.ESACCICloud
      # other_data: [climateeval.data.ERA5Monthly]
    - id: pr
      var_name: pr
      frequency: mon
      units: mm day-1
      reference_data: climateeval.data.GPCP
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: prw
      var_name: prw
      frequency: mon
      reference_data: climateeval.data.ERA5Monthly
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: rlut
      var_name: rlut
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: rsut
      var_name: rsut
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: rtnt
      var_name: rtnt
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
    - id: swcre
      var_name: swcre
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      # other_data: [climateeval.data.ESACCICloud]
    - id: ta200
      var_name: ta
      frequency: mon
      vertical_level:
        coordinate_name: air_pressure
        units: hPa
        value: 200.0
      reference_data: climateeval.data.ERA5Monthly
    - id: ta800
      var_name: ta
      frequency: mon
      vertical_level:
        coordinate_name: air_pressure
        units: hPa
        value: 800.0
      reference_data: climateeval.data.ERA5Monthly
    - id: tas
      var_name: tas
      frequency: mon
      reference_data: climateeval.data.HadCRUT5
      # other_data: [climateeval.data.CMIP6HistoricalR1I1P1F1]
    - id: ua200
      var_name: ua
      frequency: mon
      vertical_level:
        coordinate_name: air_pressure
        units: hPa
        value: 200.0
      reference_data: climateeval.data.ERA5Monthly
    - id: ua800
      var_name: ua
      frequency: mon
      vertical_level:
        coordinate_name: air_pressure
        units: hPa
        value: 800.0
      reference_data: climateeval.data.ERA5Monthly

- name: performance_metrics
  diagnostic: climateeval.diags.simple.AnnualCycleSpatialDistribution
  variables: *2d_variables

- name: annual_mean_timeseries
  diagnostic: climateeval.diags.simple.AnnualMeanTimeSeries
  variables: *2d_variables

- name: map
  diagnostic: climateeval.diags.simple.Map
  variables: *2d_variables

- name: zonal_line
  diagnostic: climateeval.diags.simple.ZonalLine
  variables: *2d_variables

- name: zonal_profile
  diagnostic: climateeval.diags.simple.ZonalProfileAirPressure
  variables:
    - id: hus
      var_name: hus
      frequency: mon
      reference_data: climateeval.data.ERA5Monthly
    - id: ta
      var_name: ta
      frequency: mon
      reference_data: climateeval.data.ERA5Monthly
    - id: ua
      var_name: ua
      frequency: mon
      reference_data: climateeval.data.ERA5Monthly
