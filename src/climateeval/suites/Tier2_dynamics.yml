# Tier2_dynamics.yml
# Dynamical diagnostics: tropical convection (Hovmöller) and stratospheric QBO.
#
# Hovmöller: longitude × time anomalies of pr, OLR (rlut), and SST (tos) averaged
#   over the tropical belt.  A 5-day rolling mean highlights MJO activity.
#   Requires daily data; a 3-year window produces a readable diagram.
#
# QBO: equatorial zonal-mean zonal wind (ua) on a pressure × time diagram
#   for the stratospheric levels 100–1 hPa.  Requires ≥5 years of monthly data;
#   longer records reveal more QBO cycles (period ≈ 28 months).

- name: Hovmoller
  diagnostic: climateeval.diags.simple.Hovmoller
  diagnostic_kwargs:
    lat_min: -15.0
    lat_max: 15.0
    rolling_window_days: 5
  variables:
    - id: pr
      var_name: pr
      frequency: day
      timerange: "20000101/20021231"
    - id: rlut
      var_name: rlut
      frequency: day
      timerange: "20000101/20021231"
    - id: tos
      var_name: tos
      frequency: day
      timerange: "20000101/20021231"

- name: QBO
  diagnostic: climateeval.diags.simple.QBO
  variables:
    - id: ua
      var_name: ua
      frequency: mon
      timerange: "19900101/20091231"
