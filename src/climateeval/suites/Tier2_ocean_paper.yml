# Suite for the manuscript figures, and nothing else.
#
# Tier2_ocean.yml lists six diagnostics. Suite._get_diagnostics builds
# them in the order they appear and splats the same **diagnostic_kwargs
# into every one of them (suites/_base.py, the from_suite_dict call), so
# this run's `figures`, `figure_options`, `output_dir` and masking
# kwargs were handed first to AnnualCycle, which does not accept them:
#
#   SimpleDiagnostic.__init__() got an unexpected keyword argument 'figures'
#
# That raised before ChlBGCEvaluation was ever constructed, which is why
# the message named the base class, why it was identical for all seven
# models, and why three runs exited 0 having written no figure at all.
#
# Keeping only the diagnostic the paper uses is the fix that touches no
# shared code. The five dropped here produce the generic annual-cycle,
# spatial-distribution, map, mean-timeseries and zonal-line output, none
# of which appears in the manuscript; the 21 figures the recipe names
# all come from ChlBGCEvaluation. Scoping diagnostic_kwargs per
# diagnostic in suites/_base.py would be the better fix for ClimateEval
# in general -- worth proposing on its own, since it changes behaviour
# every other suite depends on.
#
# Selected by `suite.name` in recipe_chl_paper.yml. Suites are located
# by filename, so this file must be named Tier2_ocean_paper.yml and live
# beside Tier2_ocean.yml in src/climateeval/suites/.

- name: chl_bgc_evaluation
  diagnostic: climateeval.diags.simple.ChlBGCEvaluation
  variables:
    - id: chl
      var_name: chl
      frequency: mon
      reference_data: climateeval.data.ESACCIOC
