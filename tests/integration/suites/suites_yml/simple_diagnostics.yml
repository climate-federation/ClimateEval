climateeval.diags.simple.AnnualCycle:
  tas:
    var_name: tas
    frequency: mon
    reference_data: climateeval.data.ERA5
  mypr:
    var_name: pr
    frequency: mon
    reference_data: climateeval.data.GPCP
    other_data: [climateeval.data.ERA5]
    min_lat: -10.0
    max_lat: 40.0
    min_lon: 10.0
    max_lon: 200.0
    timerange: 19700101/19701231
    units: g m-2 s-1

climateeval.diags.simple.TimeSeries:
  ta1000:
    var_name: ta
    frequency: mon
    reference_data: climateeval.data.ERA5
    vertical_level:
      coordinate_name: air_pressure
      units: hPa
      value: 1000.0
    timerange: 19700101/19711231
  mypr:
    var_name: pr
    frequency: mon
    reference_data: climateeval.data.GPCP
    other_data: [climateeval.data.ERA5]
    timerange: 19710101/19721231
    units: g m-2 s-1
    anomaly: full
