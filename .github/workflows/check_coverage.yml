---
name: Check coverage

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - v*.x
  pull_request:

defaults:
  run:
    shell: pixi run bash -e {0}

jobs:
  check_coverage:
    runs-on: ubuntu-latest
    name: Check coverage
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install ClimateEval
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          frozen: true
      - name: Install
        run: pip install --no-deps -e .[develop]
      - name: Run tests
        run: pytest -n 2 --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered --cov=src/climateeval tests/
      - name: Comment coverage
        id: coverage
        uses: MishaKav/pytest-coverage-comment@dd5b80bde6d16941f336518e92929e89069d8451 # v1.7.2
        with:
          coverage-path-prefix: src/climateeval/
          hide-comment: true
          junitxml-path: ./pytest.xml
          pytest-xml-coverage-path: ./coverage.xml
      - name: Check coverage
        run: |
          echo "Test coverage: ${STEPS_COVERAGE_OUTPUTS_COVERAGE} (target: 100%)"
          echo "${STEPS_COVERAGE_OUTPUTS_COVERAGE_HTML}" >> ${GITHUB_STEP_SUMMARY}
          if [ "${STEPS_COVERAGE_OUTPUTS_COVERAGE}" == '100%' ]; then
            echo "Target coverage: 100% ✅" >> ${GITHUB_STEP_SUMMARY}
          else
            echo "Target coverage: 100% ❌" >> ${GITHUB_STEP_SUMMARY}
            exit 1
          fi
        env:
          STEPS_COVERAGE_OUTPUTS_COVERAGE: ${{ steps.coverage.outputs.coverage }}
          STEPS_COVERAGE_OUTPUTS_COVERAGE_HTML: ${{ steps.coverage.outputs.coverageHtml }}
