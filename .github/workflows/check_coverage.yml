---
name: Check coverage

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - v*.x
  pull_request:

defaults:
  run:
    shell: pixi run bash -e {0}

jobs:
  check_coverage:
    runs-on: ubuntu-latest
    name: Check coverage
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install ClimateEval
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          frozen: true
      - name: Install
        run: pip install --no-deps -e .[develop]
      - name: Run tests
        run: pytest -n 2 --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered --cov=src/climateeval tests/
      - name: Comment coverage
        id: coverage
        uses: MishaKav/pytest-coverage-comment@fd9adbdca9fdfbe2b9bfa44a7340e6a83346ce6c # v1.10.0
        with:
          coverage-path-prefix: src/climateeval/
          hide-comment: true
          junitxml-path: ./pytest.xml
          pytest-xml-coverage-path: ./coverage.xml
      - name: Check coverage
        run: |
          coverage_pct=${STEPS_COVERAGE_OUTPUTS_COVERAGE%\%}
          echo "Test coverage: ${STEPS_COVERAGE_OUTPUTS_COVERAGE} (floor: ${COVERAGE_FLOOR}%)"
          echo "${STEPS_COVERAGE_OUTPUTS_COVERAGE_HTML}" >> ${GITHUB_STEP_SUMMARY}
          if awk "BEGIN { exit !(${coverage_pct:-0} >= ${COVERAGE_FLOOR}) }"; then
            echo "Coverage ${STEPS_COVERAGE_OUTPUTS_COVERAGE} >= ${COVERAGE_FLOOR}% floor ✅" >> ${GITHUB_STEP_SUMMARY}
          else
            echo "Coverage ${STEPS_COVERAGE_OUTPUTS_COVERAGE} < ${COVERAGE_FLOOR}% floor ❌ (add tests or lower the floor)" >> ${GITHUB_STEP_SUMMARY}
            exit 1
          fi
        env:
          # Ratcheting floor on the scientific core (report/* is omitted; see
          # [tool.coverage.run] in pyproject.toml). Raise this as tests are added.
          COVERAGE_FLOOR: "70"
          STEPS_COVERAGE_OUTPUTS_COVERAGE: ${{ steps.coverage.outputs.coverage }}
          STEPS_COVERAGE_OUTPUTS_COVERAGE_HTML: ${{ steps.coverage.outputs.coverageHtml }}
