# Entries the CE-6..CE-8 diagnostics need in src/climateeval/variables.yml.
# The identical tlt, tmt, eis, lts and hurs entries are already in the ce-data worktree
# (CE-5); merge each name only once. tts and tls are only needed for the optional
# MSUTemperature(channels=("tts", "tls")).
eis:
  coordinates: [time, lat, lon]
  long_name: Estimated Inversion Strength
  realm: atmos
  standard_name: ""
  units: "K"
hurs:
  coordinates: [time, lat, lon]
  long_name: Near-Surface Relative Humidity
  realm: atmos
  standard_name: relative_humidity
  units: "%"
lts:
  coordinates: [time, lat, lon]
  long_name: Lower-Tropospheric Stability
  realm: atmos
  standard_name: ""
  units: "K"
tlt:
  coordinates: [time, lat, lon]
  long_name: Temperature of the Lower Troposphere (MSU-Equivalent)
  realm: atmos
  standard_name: ""
  units: "K"
tmt:
  coordinates: [time, lat, lon]
  long_name: Temperature of the Mid Troposphere (MSU-Equivalent)
  realm: atmos
  standard_name: ""
  units: "K"
tts:
  coordinates: [time, lat, lon]
  long_name: Temperature of the Troposphere/Stratosphere (MSU-Equivalent)
  realm: atmos
  standard_name: ""
  units: "K"
tls:
  coordinates: [time, lat, lon]
  long_name: Temperature of the Lower Stratosphere (MSU-Equivalent)
  realm: atmos
  standard_name: ""
  units: "K"
