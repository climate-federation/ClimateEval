[project]
name = "climateeval"
version = "0.0.1"
description = "Framework for evaluating and benchmarking Earth System Model output"
authors = [
    {name = "Manuel Schlund", email = "manuel.schlund@dlr.de"},
]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ESMValTool", "Earth System Model Evaluation"]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cdsapi",
    "cf-units",
    "esmvalcore",
    "esmvaltool",
    "ibis-framework",
    "intake-esgf",
    "loguru",
    "ncdata",
    "numpy",
    "pandas>=3",
    "pyyaml",
    "scitools-iris",
    "tzdata",  # required by ibis-framework
    "xarray",
]


[tool.codespell]
ignore-words-list = "vas"


[tool.pixi.dependencies]
cdsapi = "*"
cf-units = "*"
esmvalcore = ">=2.14.0"
esmvaltool-python = ">=2.14.0"
ibis-framework = "*"
intake-esgf = "*"
iris = "*"
loguru = "*"
ncdata = "*"
numpy = "*"
pandas = ">=3"
pyyaml = "*"
tzdata = "*"  # required by ibis-framework
xarray = "*"

[tool.pixi.environments]
default = { features= ["dev", "test"], solve-group = "default" }
test-py312 = { features = ["py312", "test"], solve-group = "py312" }
test-py313 = { features = ["py313", "test"], solve-group = "py313" }

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-mock = "*"
pytest-xdist = "*"

[tool.pixi.feature.py312.dependencies]
"python" = "3.12.*"

[tool.pixi.feature.py313.dependencies]
"python" = "3.13.*"

[tool.pixi.pypi-dependencies]
climateeval = { path = ".", editable = true }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]


[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
minversion = "6.0"
xfail_strict = true


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",     # Dynamically typed expressions (typing.Any) are disallowed
    "G004",       # Logging statement uses f-string
]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"*example.py" = [
    "ERA001",     # Found commented-out code
    "T201",       # `print` found
]
"tests/**.py" = [
    "ARG001",     # Unused function arguments
    "D100",       # Missing docstring in public module
    "D101",       # Missing docstring in public class
    "D102",       # Missing docstring in public method
    "D103",       # Missing docstring in public function
    "D104",       # Missing docstring in public package
    "FBT001",     # Boolean-typed positional argument in function definition
    "PLR2004",    # Magic value used in comparison
    "S101",       # Use of `assert` detected
    "SLF001",     # Private member accessed
]
"tests/sample_data/create_sample_data_sources.py" = [
    "INP001",     # File is part of an implicit namespace package.
    "T201",       # `print` found
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
