[project]
name = "climateeval"
version = "0.0.1"
description = "Framework for evaluating and benchmarking Earth System Model output"
authors = [
    {name = "Manuel Schlund", email = "manuel.schlund@dlr.de"},
]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ESMValTool", "Earth System Model Evaluation"]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cdsapi",
    "cf-units",
    "esmvalcore",
    "esmvaltool",
    "ibis-framework",
    "intake-esgf",
    "loguru",
    "ncdata",
    "numpy",
    "pandas>=3",
    "pyyaml",
    "scitools-iris",
    "tzdata",  # required by ibis-framework
    "xarray",
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
cdsapi = "*"
cf-units = "*"
ibis-framework = "*"
intake-esgf = "*"
iris = "*"
loguru = "*"
ncdata = "*"
numpy = "*"
pandas = ">=3"
pyyaml = "*"
tzdata = "*"  # required by ibis-framework
xarray = "*"

[tool.pixi.pypi-dependencies]
climateeval = { path = ".", editable = true }

[tool.pixi.environments]
default = { features= ["esmvaltool", "dev", "test"], solve-group = "default" }
esmvaltool-dev = { features= ["esmvaltool-dev", "dev", "test"], solve-group = "esmvaltool-dev" }
test-py312 = { features = ["esmvaltool", "py312", "test"], solve-group = "py312" }
test-py313 = { features = ["esmvaltool", "py313", "test"], solve-group = "py313" }

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
ruff = "*"

[tool.pixi.feature.esmvaltool.dependencies]
esmvalcore = ">=2.14.0"
esmvaltool-python = ">=2.14.0"

# Ensure that all ESMValTool dependencies are installed from conda-forge, not
# PyPI
[tool.pixi.feature.esmvaltool-dev.dependencies]
aiohttp = "*"
cartopy = "*"
cdo = ">=2.3.0"
cfgrib = "*"
cftime = "*"
cmocean = "*"
cython = "*"
dask = "!=2024.8.0"
distributed = "*"
ecmwf-api-client = "*"
eofs = "*"
esmpy = "*"
fiona = "*"
fire = "*"
fsspec = "*"
gdal = ">=3.9.0"
ipython = "*"
imagehash = "*"
iris-esmf-regrid = ">=0.10.0"
jinja2 = "*"
joblib = "*"
lime = "*"
mapgenerator = ">=1.0.5"
matplotlib-base = "*"
natsort = "*"
nc-time-axis = "*"
netCDF4 = "*"
numba = "*"
openpyxl = "*"
packaging = "*"
pip = "!=21.3"
progressbar2 = "*"
prov = "*"
pyproj = ">=2.1"
pys2index = "*"
python = ">=3.12"
python-cdo = "*"
python-dateutil = "*"
rasterio = ">=1.3.10"
requests = "*"
scikit-image = "*"
scikit-learn = ">=1.4.0"
scipy = "*"
seaborn = "*"
seawater = "*"
shapely = ">=2.0.2"
xesmf = ">=0.7.1"
xgboost = ">1.6.1"
xlsxwriter = "*"
zarr = "*"

[tool.pixi.feature.esmvaltool-dev.pypi-dependencies]
esmvalcore = { git = "https://github.com/ESMValGroup/ESMValCore.git", branch = "main" }
esmvaltool = { git = "https://github.com/ESMValGroup/ESMValTool.git", branch = "main" }
# esmvalcore = { path = "../ESMValCore", editable = true }
# esmvaltool = { path = "../ESMValTool", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-html = "*"
pytest-mock = "*"
pytest-xdist = "*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"


[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--doctest-modules",
    "--cov-report=xml:test-reports/coverage.xml",
    "--cov-report=html:test-reports/coverage_html",
    "--html=test-reports/report.html",
]
minversion = "6.0"
xfail_strict = true


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",     # Dynamically typed expressions (typing.Any) are disallowed
    "G004",       # Logging statement uses f-string
]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"*example.py" = [
    "ERA001",     # Found commented-out code
    "T201",       # `print` found
]
"generate_html.py" = [
    "E501",       # Line too long
]
"src/climateeval/report/*.py" = [
    "E501",       # Line too long
]
"tests/**.py" = [
    "ARG001",     # Unused function arguments
    "D100",       # Missing docstring in public module
    "D101",       # Missing docstring in public class
    "D102",       # Missing docstring in public method
    "D103",       # Missing docstring in public function
    "D104",       # Missing docstring in public package
    "FBT001",     # Boolean-typed positional argument in function definition
    "PLR2004",    # Magic value used in comparison
    "S101",       # Use of `assert` detected
    "SLF001",     # Private member accessed
]
"tests/sample_data/create_sample_data_sources.py" = [
    "INP001",     # File is part of an implicit namespace package.
    "T201",       # `print` found
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.codespell]
ignore-words-list = "vas"
